global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: api
    dns_sd_configs:
      - names: ["api"]
        type: A
        port: 9464
        refresh_interval: 15s
  - job_name: command-consumer
    dns_sd_configs:
      - names: ["command-consumer"]
        type: A
        port: 9466
        refresh_interval: 15s
  - job_name: reference-worker
    dns_sd_configs:
      - names: ["reference-worker"]
        type: A
        port: 9465
        refresh_interval: 15s
  - job_name: outbox-publisher
    dns_sd_configs:
      - names: ["outbox-publisher"]
        type: A
        port: 9467
        refresh_interval: 15s
  - job_name: event-consumer
    dns_sd_configs:
      - names: ["event-consumer"]
        type: A
        port: 9468
        refresh_interval: 15s
