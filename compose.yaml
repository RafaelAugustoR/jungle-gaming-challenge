name: jungle-challenge
x-backend-env: &backend-env
  METRICS_ALLOWED_CIDR: ${METRICS_NETWORK_SUBNET:-172.31.20.0/24}
  DATABASE_URL: postgresql://jungle_runtime:runtime-demo-only@postgres:5432/jungle
  PROVIDER_CLIENTS: ${PROVIDER_CLIENTS:-}
  FINANCIAL_LOCK_TIMEOUT_MS: ${FINANCIAL_LOCK_TIMEOUT_MS:-3000}
  FINANCIAL_STATEMENT_TIMEOUT_MS: ${FINANCIAL_STATEMENT_TIMEOUT_MS:-5000}
  FINANCIAL_DEADLINE_MS: ${FINANCIAL_DEADLINE_MS:-15000}
  REFERENCE_TTL_MS: ${REFERENCE_TTL_MS:-900000}
  REFERENCE_BASE_MS: ${REFERENCE_BASE_MS:-1000}
  REFERENCE_MAX_MS: ${REFERENCE_MAX_MS:-30000}
  KEYCLOAK_ISSUER: http://localhost:18080/realms/jungle
  KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/jungle/protocol/openid-connect/certs
  SQS_ENDPOINT: http://sqs:4566
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: jungle
      POSTGRES_PASSWORD: local-demo-only
      POSTGRES_DB: jungle
    ports: ["127.0.0.1:55439:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jungle -d jungle"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  sqs:
    image: localstack/localstack:4.0.3
    environment:
      SERVICES: sqs
      SQS_ENDPOINT_STRATEGY: dynamic
    ports: ["127.0.0.1:4566:4566"]
    healthcheck:
      test: ["CMD", "awslocal", "sqs", "list-queues"]
      interval: 3s
      timeout: 5s
      retries: 30
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm"]
    volumes: ["./infra/keycloak/jungle-realm.json:/opt/keycloak/data/import/jungle-realm.json:ro"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-demo-only
      KC_HEALTH_ENABLED: "true"
    ports: ["127.0.0.1:18080:8080"]
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3"]
      interval: 3s
      timeout: 3s
      retries: 60
  api:
    build:
      context: .
      target: runtime
    ports: ["127.0.0.1:3000:3000"]
    networks: [default, metrics-scrape]
    environment:
      <<: *backend-env
      METRICS_PORT: 9464
      DEMO_PROVIDER_CLIENT_SECRETS: ${DEMO_PROVIDER_CLIENT_SECRETS:-}
      KEYCLOAK_TOKEN_URL: http://keycloak:8080/realms/jungle/protocol/openid-connect/token
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      postgres: { condition: service_healthy }
      sqs: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }
  reference-worker:
    build:
      context: .
      target: runtime
    command: ["bun", "src/bootstrap/reference-worker.ts"]
    networks: [default, metrics-scrape]
    environment:
      <<: *backend-env
      METRICS_PORT: 9465
      REFERENCE_POLL_MS: ${REFERENCE_POLL_MS:-500}
      REFERENCE_BATCH_SIZE: ${REFERENCE_BATCH_SIZE:-50}
    stop_grace_period: 25s
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
  provision:
    image: postgres:16.6-alpine
    environment:
      PGPASSWORD: local-demo-only
    entrypoint: ["psql", "-h", "postgres", "-U", "jungle", "-d", "jungle", "-v", "ON_ERROR_STOP=1", "-f", "/runtime.sql"]
    volumes: ["./infra/postgres/runtime.sql:/runtime.sql:ro"]
    depends_on:
      postgres: { condition: service_healthy }
  migrate:
    build:
      context: .
      target: runtime
    command: ["bun", "scripts/migrate.ts", "up"]
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql://jungle:local-demo-only@postgres:5432/jungle
    depends_on:
      postgres: { condition: service_healthy }
      provision: { condition: service_completed_successfully }
  provision-commands:
    build:
      context: .
      target: runtime
    command: ['bun', 'run', 'provision:commands']
    environment:
      <<: *backend-env
      COMMAND_QUEUE_NAME: ${COMMAND_QUEUE_NAME:-wager-transactions.fifo}
      COMMAND_MAX_RECEIVE_COUNT: ${COMMAND_MAX_RECEIVE_COUNT:-5}
      COMMAND_VISIBILITY_SECONDS: ${COMMAND_VISIBILITY_SECONDS:-30}
    depends_on:
      sqs: { condition: service_healthy }
  command-consumer:
    build:
      context: .
      target: runtime
    command: ['bun', 'run', 'worker:commands']
    restart: unless-stopped
    networks: [default, metrics-scrape]
    environment:
      <<: *backend-env
      METRICS_PORT: 9466
      COMMAND_QUEUE_NAME: ${COMMAND_QUEUE_NAME:-wager-transactions.fifo}
      COMMAND_VISIBILITY_SECONDS: ${COMMAND_VISIBILITY_SECONDS:-30}
      COMMAND_CALL_TIMEOUT_MS: ${COMMAND_CALL_TIMEOUT_MS:-5000}
      COMMAND_WAIT_SECONDS: ${COMMAND_WAIT_SECONDS:-2}
      COMMAND_RETRY_BASE_MS: ${COMMAND_RETRY_BASE_MS:-1000}
      COMMAND_RETRY_MAX_MS: ${COMMAND_RETRY_MAX_MS:-30000}
      COMMAND_DRAIN_MS: ${COMMAND_DRAIN_MS:-20000}
    stop_grace_period: 30s
    depends_on:
      migrate: { condition: service_completed_successfully }
      provision-commands: { condition: service_completed_successfully }
  provision-events:
    profiles: ["events"]
    build:
      context: .
      target: runtime
    command: ["bun", "run", "provision:events"]
    environment:
      <<: *backend-env
      OUTBOX_QUEUE_NAME: ${OUTBOX_QUEUE_NAME:-wager-events.fifo}
    depends_on:
      sqs: { condition: service_healthy }
  outbox-publisher:
    profiles: ["events"]
    build:
      context: .
      target: runtime
    command: ["bun", "run", "worker:outbox"]
    restart: unless-stopped
    networks: [default, metrics-scrape]
    environment: &event-env
      <<: *backend-env
      METRICS_PORT: 9467
      OUTBOX_QUEUE_NAME: ${OUTBOX_QUEUE_NAME:-wager-events.fifo}
      OUTBOX_LEASE_MS: ${OUTBOX_LEASE_MS:-30000}
      OUTBOX_SEND_TIMEOUT_MS: ${OUTBOX_SEND_TIMEOUT_MS:-5000}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-20}
      OUTBOX_RETRY_BASE_MS: ${OUTBOX_RETRY_BASE_MS:-1000}
      OUTBOX_RETRY_MAX_MS: ${OUTBOX_RETRY_MAX_MS:-60000}
      OUTBOX_POLL_MS: ${OUTBOX_POLL_MS:-500}
    depends_on:
      migrate: { condition: service_completed_successfully }
      provision-events: { condition: service_completed_successfully }
  event-consumer:
    profiles: ["events"]
    build:
      context: .
      target: runtime
    command: ["bun", "run", "worker:events"]
    restart: unless-stopped
    networks: [default, metrics-scrape]
    environment:
      <<: *event-env
      METRICS_PORT: 9468
    depends_on:
      migrate: { condition: service_completed_successfully }
      provision-events: { condition: service_completed_successfully }
  tests:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      <<: *backend-env
      METRICS_PORT: 0
      DATABASE_URL: postgresql://jungle:local-demo-only@postgres:5432/jungle
      KEYCLOAK_ISSUER: http://keycloak:8080/realms/jungle
      INTEGRATION: "1"
    depends_on:
      postgres: { condition: service_healthy }
      sqs: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      provision: { condition: service_completed_successfully }
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=7d"]
    volumes: ["./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "prometheus-data:/prometheus"]
    ports: ["127.0.0.1:9090:9090"]
    networks: [metrics-scrape, metrics-ui, monitoring-edge]
    depends_on:
      api: { condition: service_started }
      command-consumer: { condition: service_started }
      reference-worker: { condition: service_started }
  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-demo-only}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3001:3000"]
    networks: [metrics-ui, monitoring-edge]
    depends_on:
      prometheus: { condition: service_started }
volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
networks:
  metrics-scrape:
    internal: true
    ipam:
      config:
        - subnet: ${METRICS_NETWORK_SUBNET:-172.31.20.0/24}
  metrics-ui:
    internal: true
  monitoring-edge: {}
