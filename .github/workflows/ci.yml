name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://jungle:local-demo-only@127.0.0.1:55439/jungle
      SQS_ENDPOINT: http://127.0.0.1:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: docker compose up -d --wait postgres sqs
      - run: bun run test:integration
      - run: docker compose up -d --build --wait api
      - run: curl --fail http://localhost:3000/health/ready
      - if: failure()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down
