name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: docker compose up -d --wait postgres sqs keycloak
      - run: INTEGRATION=1 bun test
      - run: docker compose up -d --build api
      - run: curl --fail --retry 15 --retry-connrefused --retry-delay 2 http://localhost:3000/health/ready
      - if: failure()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down
