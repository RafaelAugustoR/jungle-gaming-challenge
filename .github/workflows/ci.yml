name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run format:check
      - run: cp .env.example .env
      - run: bun test tests/unit
      - run: docker compose up -d --wait postgres sqs keycloak
      - run: docker compose run --rm provision
      - run: bun run test:integration
      - run: docker compose up -d --build --wait api reference-worker
      - run: curl --fail http://localhost:3000/health/ready
      - run: STACK_URL=http://localhost:3000 bun run test:stack
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:browser
      - if: failure()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down
